# Development services, added on top of docker-compose.yaml through COMPOSE_FILE in .env.
# In production, set COMPOSE_FILE=docker-compose.yaml so these services are not started.
services:
  app:
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:${MYSQL_VERSION:-9.7}
    container_name: project-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - symfony-ntwk
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  adm:
    image: adminneoorg/adminneo:latest
    container_name: project-adm
    env_file:
      - .env
    ports:
      - "8089:8080"
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - NEO_COLOR_VARIANT=blue
      - NEO_DEFAULT_SERVER=db
      - NEO_DEFAULT_DATABASE=${DB_NAME}
    networks:
      - symfony-ntwk

volumes:
  db-data:
    name: project-db-data
