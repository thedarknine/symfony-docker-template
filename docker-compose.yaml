services:
  app:
    container_name: project-app
    env_file:
      - .env
    build:
      context: .docker
      dockerfile: php.Dockerfile
      args:
        - PHP_VERSION=8.4
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./:/var/www/html
    networks:
      - symfony-ntwk

  engine:
    container_name: project-server
    image: nginx:${NGINX_VERSION:-1.30}-alpine
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - symfony-ntwk
    depends_on:
      - app

networks:
  symfony-ntwk:
    driver: bridge
    name: symfony-ntwk
