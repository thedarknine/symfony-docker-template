# Weekly update pull requests. Minor and patch updates are grouped into one pull request per
# ecosystem to limit the noise; major updates get their own pull request.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci

    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          composer-minor-patch:
              update-types: [minor, patch]

    # pnpm projects use the npm ecosystem (pnpm-lock.yaml is supported)
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          npm-minor-patch:
              update-types: [minor, patch]
